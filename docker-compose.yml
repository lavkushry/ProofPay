services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: proofpay
      POSTGRES_PASSWORD: proofpay_password
      POSTGRES_DB: proofpay
    ports:
      - "127.0.0.1:${PROOFPAY_DB_PORT:-5432}:5432"
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpay"]
      interval: 5s
      timeout: 5s
      retries: 5

  provision:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ADMIN_DATABASE_URL: postgresql://proofpay:proofpay_password@db:5432/proofpay
      PROOFPAY_MIGRATOR_PASSWORD: ${PROOFPAY_MIGRATOR_PASSWORD:-local_migration_only}
      PROOFPAY_API_PASSWORD: ${PROOFPAY_API_PASSWORD:-local_api_only}
      PROOFPAY_EXECUTOR_PASSWORD: ${PROOFPAY_EXECUTOR_PASSWORD:-local_executor_only}
    command: ["python", "-m", "backend.provision_db"]
    depends_on:
      db:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://proofpay_migrator:${PROOFPAY_MIGRATOR_PASSWORD:-local_migration_only}@db:5432/proofpay
      DATABASE_URL: postgresql+asyncpg://proofpay_migrator:${PROOFPAY_MIGRATOR_PASSWORD:-local_migration_only}@db:5432/proofpay
    command: ["sh", "-c", "python -m backend.migrate && python -m backend.seed"]
    depends_on:
      provision:
        condition: service_completed_successfully

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:${PROOFPAY_API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://proofpay_api:${PROOFPAY_API_PASSWORD:-local_api_only}@db:5432/proofpay
      ENVIRONMENT: development
      DEBUG: "false"
      FIXTURE_URL: http://fixture:8080
      CORS_ORIGINS: '["http://localhost:${PROOFPAY_WEB_PORT:-3000}","http://127.0.0.1:${PROOFPAY_WEB_PORT:-3000}"]'
      SESSION_COOKIE_SECURE: "false"
      SESSION_CSRF_KEY: ${SESSION_CSRF_KEY:-local-only-session-key-change-before-deployment}
      DEMO_JUDGE_ACCESS_CODE: ${DEMO_JUDGE_ACCESS_CODE:-local-judge-access}
      DEMO_OWNER_ACCESS_CODE: ${DEMO_OWNER_ACCESS_CODE:-local-owner-access}
      DEMO_MAYA_ACCESS_CODE: ${DEMO_MAYA_ACCESS_CODE:-local-maya-access}
      DEMO_LEO_ACCESS_CODE: ${DEMO_LEO_ACCESS_CODE:-local-leo-access}
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://proofpay_api:${PROOFPAY_API_PASSWORD:-local_api_only}@db:5432/proofpay
      ENVIRONMENT: development
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-120}
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-20}
      LLM_PROVIDER: ${LLM_PROVIDER:-unconfigured}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_MAX_CALLS_PER_STAGE: ${LLM_MAX_CALLS_PER_STAGE:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4.1-mini}
      OPENROUTER_HTTP_REFERER: ${OPENROUTER_HTTP_REFERER:-}
      OPENROUTER_X_TITLE: ${OPENROUTER_X_TITLE:-ProofPay}
    command: ["python", "-m", "backend.worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  fixture:
    build:
      context: .
      dockerfile: fixture/Dockerfile
    ports:
      - "127.0.0.1:${PROOFPAY_FIXTURE_PORT:-8080}:8080"

  runner:
    profiles: ["verification"]
    build:
      context: ./runner
      dockerfile: Dockerfile
    environment:
      - FIXTURE_URL=http://fixture:8080
      - API_URL=http://api:8000
    depends_on:
      - fixture
      - api

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${PROOFPAY_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata17:
