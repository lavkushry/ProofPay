name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            fixture/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r fixture/requirements.txt
      - run: python -m compileall -q backend fixture runner scripts
      - run: python -m pytest -q -m 'not postgres'
      - run: python scripts/api_inventory.py --check
      - run: npm ci && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
  postgres-integrity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: proofpay_test_admin
          POSTGRES_PASSWORD: local_test_admin
          POSTGRES_DB: proofpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofpay_test_admin -d proofpay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PROOFPAY_TEST_DATABASE_URL: postgresql://proofpay_test_admin:local_test_admin@localhost:5432/proofpay_test
      PROOFPAY_RUNNER_BROWSER_TESTS: '1'
      PROOFPAY_RUNNER_IMAGE: proofpay-runner-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - run: docker build -f runner/Dockerfile -t proofpay-runner-acceptance .
      - run: python -m pytest -q -m postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: artifacts/verification
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker compose --profile verification up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke_test.py
      - run: python scripts/runner_isolation.py
      - run: docker build -f runner/Dockerfile -t proofpay-browser-check .
      - run: install -d -m 0777 artifacts/browser
      - run: >-
          docker run --rm --network host
          -v "$PWD/scripts/browser_smoke.py:/app/browser_smoke.py:ro"
          -v "$PWD/artifacts/browser:/screenshots"
          proofpay-browser-check python /app/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation
          path: artifacts/browser
      - run: docker compose logs --tail=80
        if: failure()
      - run: docker compose down
        if: always()
