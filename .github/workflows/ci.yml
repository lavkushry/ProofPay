name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            fixture/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt -r fixture/requirements.txt
      - run: python -m compileall -q backend fixture runner scripts
      - run: python -m pytest -q
      - run: python scripts/api_inventory.py --check
      - run: npm ci && npm run build && npm audit --audit-level=moderate
        working-directory: frontend
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: python scripts/smoke_test.py
      - run: docker compose logs --tail=80
        if: failure()
      - run: docker compose down
        if: always()
