x-paypal-boundary:
- method: POST
  path: /v1/oauth2/token
- method: POST
  path: /v1/payments/payouts
- method: GET
  path: /v1/payments/payouts/{batch_id}
- method: GET
  path: /v1/payments/payouts-item/{item_id}
- method: POST
  path: /v1/notifications/verify-webhook-signature
- method: POST
  path: /v1/payments/payouts-item/{item_id}/cancel
x-error-semantics:
  inaccessible_resource: 404; do not leak another contractor resource
  schema_or_scope: 422; no domain mutation
  stale_or_key_conflict: 409; preserve original result/history
  async_guard_hold: 202 with held state/reasons; no dispatch
  webhook_storage_failure: 503; never acknowledge lost work
  verified_event_failure: Quarantine only; forged event IDs cannot occupy canonical verified dedup
x-red-team:
- criterion: Technological Implementation
  challenge: Typed endpoints might hide scripted inference or unsafe payout writes.
  response: Actual tool lineage, executor-only initiation, immutable bindings and matched item reconciliation;
    runtime proof pending.
- criterion: Design
  challenge: Accepted jobs may be mistaken for completed payments.
  response: 202 acknowledgement, explicit job/hold/status models and paid receipt only after matched SUCCESS.
- criterion: Potential Impact
  challenge: Generic APIs do not identify the agency audience.
  response: Assigned contractor portal and agency-specific brief/mandate/evidence workflow; owner validation
    remains required.
- criterion: Innovation
  challenge: A family selector could merely return presets.
  response: Actual intent/ambiguity inference and multimodal contradiction review with distinct template
    contracts.
- criterion: Presentation
  challenge: Seed/reset might generate fake receipts.
  response: Original genuine archive IDs, missing-proof readiness and history-preserving reset.
x-requirements:
- id: US-01
  priority: Must
  acceptance_criteria: Given a supported brief and recipient, when I approve three checks and conditional
    authority, then a passing delivery can request payment under the frozen mandate and expose its outcome.
  judging_criteria: T, D, I
  demo: D02–D10
- id: US-04
  priority: Must
  acceptance_criteria: Given a brief missing a required supported parameter, when compilation identifies
    ambiguity, then I can supply clarification and no approval/payout is enabled until three valid checks
    are available.
  judging_criteria: T, D
  demo: D02–D03 companion
- id: US-05
  priority: Must
  acceptance_criteria: Given draft terms and their version digest, when I approve or later revise them,
    then approval freezes that version and a revision creates a new one while retaining obligation payment
    history.
  judging_criteria: T, D
  demo: D04 companion
- id: US-06
  priority: Must
  acceptance_criteria: Given all executable checks pass but AI is uncertain, when I record a cited resolution,
    then the original verdict remains visible; a failed executable check still prevents release.
  judging_criteria: T, D
  demo: D06–D08 companion
- id: US-07
  priority: Must
  acceptance_criteria: Given failed, processing, or unclaimed payment, when I inspect it, then I see the
    reason, reserved principal, permitted action, and confirmed outcome without creating a duplicate attempt.
  judging_criteria: T, D
  demo: D08–D10 companion
- id: US-02
  priority: Must
  acceptance_criteria: Given failed artifact-bound evidence, when I open the correction and submit a corrected
    version, then verification resumes under the same approved criteria and preserves the previous findings.
  judging_criteria: D, I
  demo: D06–D07
- id: US-08
  priority: Must
  acceptance_criteria: Given my assigned approved task, when I open the portal and select an allowed artifact,
    then I see its three checks, amount, authority deadline, claim field, and acknowledgement for that
    delivery.
  judging_criteria: D, I
  demo: D05, D07
- id: US-09
  priority: Must
  acceptance_criteria: Given a payment attempt for my task, when I inspect status or receipt, then I see
    its actual state, amount, observed fees, last reconciliation time, and linked evidence while other
    contractors' data is denied.
  judging_criteria: T, D
  demo: D10, D12
- id: US-03
  priority: Must
  acceptance_criteria: Given seeded owner/contractor access, when I follow broken delivery, correction,
    payment, and replay, then actual evidence, item state, receipt, and dedup behavior are inspectable
    without supplying keys.
  judging_criteria: T, D, P
  demo: D01–D12
- id: US-10
  priority: Must
  acceptance_criteria: Given the three canonical briefs, when I compile each, then each yields three distinct
    valid templates/parameters and the family check sets differ materially.
  judging_criteria: T, N
  demo: D03 companion
- id: US-11
  priority: Must
  acceptance_criteria: Given a completed or unresolved obligation, when I replay its delivery/event, then
    I receive the existing attempt reference and no new financial initiation is created.
  judging_criteria: T, P
  demo: D11
- id: US-12
  priority: Must
  acceptance_criteria: Given the workspace's current financial state, when I request reset, then unresolved
    movement defers reset; a safe reset creates a fresh namespace and retains genuine completed/audit
    records.
  judging_criteria: T, D, P
  demo: D01, D11 companion
- id: FR-01
  priority: Must
  acceptance_criteria: Given unsupported family/fixture, third recipient, non-USD terms, or custom executable
    check, when submitted through any role/API, then reject with a specific reason and create no payment.
  judging_criteria: T, D
  demo: D02, D08 companion
- id: FR-02
  priority: Must
  acceptance_criteria: Given the canonical responsive, API, and keyboard briefs and trusted manifest,
    when ambiguities are resolved and compilation runs, then each produces three distinct allowlisted
    checks with valid parameters; family sets differ materially and unsupported baselines are rejected.
  judging_criteria: T, N
  demo: D03
- id: FR-17
  priority: Must
  acceptance_criteria: Given authorized owner input, when saved, then retain text/revision, supported
    family, fixture reference, contractor reference, proposed financial terms, and actor; later edits
    create a new draft revision without rewriting approved history.
  judging_criteria: T, D
  demo: D02
- id: FR-18
  priority: Must
  acceptance_criteria: Given missing required intent/parameters or invalid compiler output, when compilation
    completes, then display ambiguities/questions or a failure reason, accept clarification, and keep
    approval disabled until exactly three valid checks exist.
  judging_criteria: T, D, N
  demo: D03 companion
- id: FR-03
  priority: Must
  acceptance_criteria: Given a valid reviewed draft, when approved, then freeze its complete financial/check
    payload with approver, timestamp, digest and receiver binding; an attempted edit is rejected and must
    create a new version.
  judging_criteria: T, D
  demo: D04
- id: FR-04
  priority: Must
  acceptance_criteria: Given a decision request, when any release guard fails, then make no dispatch and
    persist a specific hold/guard result; only fully eligible current authority may initiate.
  judging_criteria: T
  demo: D06, D08
- id: FR-19
  priority: Must
  acceptance_criteria: Given the owner's draft/version digest, when approval is submitted, then require
    exactly three distinct valid checks, positive USD amount within cap, allowed pinned receiver, future
    expiry and max attempts 1–3; a stale digest or invalid field blocks approval.
  judging_criteria: T, D
  demo: D04 companion
- id: FR-20
  priority: Must
  acceptance_criteria: Given a revised draft for an existing milestone, when the new version is approved,
    then supersede prior initiation authority, preserve all snapshots/attempts/budget history, and require
    evidence bound to the new version before any permitted initiation; a prior successful payment cannot
    be paid again.
  judging_criteria: T
  demo: D04, D08 companion
- id: FR-05
  priority: Must
  acceptance_criteria: Given an allowlisted artifact selection, when submitted, then persist its digest,
    delivery ID, submitting actor and approved mandate digest, and bind all resulting verification evidence
    to them.
  judging_criteria: T
  demo: D05, D07
- id: FR-08
  priority: Must
  acceptance_criteria: Given failed delivery findings, when `request_correction` is validated and a corrected
    artifact arrives, then persist an internal portal message with evidence references, create a new run,
    retain the predecessor, and preserve the approved criteria.
  judging_criteria: D, I
  demo: D06–D07
- id: FR-21
  priority: Must
  acceptance_criteria: Given an assigned contractor submission before initiation, when accepted, then
    record claim text, artifact reference, delivery sequence and acknowledgement; repeated submission
    identity returns the existing delivery and invalid post-initiation replacement is rejected.
  judging_criteria: T, D
  demo: D05, D07
- id: FR-22
  priority: Must
  acceptance_criteria: Given a newer delivery or mandate version, when an older runner/model job finishes,
    then retain its history but mark it ineligible for release; only the latest selected delivery with
    matching current authority can proceed.
  judging_criteria: T
  demo: D07–D08 companion
- id: FR-06
  priority: Must
  acceptance_criteria: Given three approved templates/parameters and a bound artifact, when the runner
    finishes, then persist a result for each check plus applicable screenshots, run ID, digests and timestamps;
    a timeout/error is not a pass.
  judging_criteria: T, P
  demo: D05–D08
- id: FR-07
  priority: Must
  acceptance_criteria: Given the broken responsive artifact claiming “fixed,” when reviewed, then fail
    release and cite the submitted claim, failed overflow result and same-run 320px screenshot; every
    per-check verdict has valid attributable references.
  judging_criteria: T, N, P
  demo: D06
- id: FR-09
  priority: Must
  acceptance_criteria: Given uncertain evidence review, when stored, then remain in `verifying` with `review_required=true`
    and no dispatch; only an authorized grounded resolution can clear ambiguity, and no failed executable
    check may be waived.
  judging_criteria: T, D
  demo: D06–D08 companion
- id: FR-23
  priority: Must
  acceptance_criteria: Given an authorized evidence request, when opened, then show delivery/artifact/mandate/run
    identifiers, all three results and available screenshots; wrong-task, wrong-version or nonexistent
    references are rejected before model review.
  judging_criteria: T, D, P
  demo: D06, D08
- id: FR-24
  priority: Must
  acceptance_criteria: Given malformed output, injection text, unsupported tools, invented references
    or a model timeout, when processed, then reject it, record the failure and apply a bounded repair/review
    policy; no failure can generate payment authority or invented successful evidence.
  judging_criteria: T
  demo: D03, D06 companion
- id: FR-25
  priority: Must
  acceptance_criteria: Given all executable checks pass and AI remains uncertain, when an owner resolves
    it with rationale and valid references, then append the resolution and re-evaluate release guards
    while retaining the original verdict; resolution is denied for failed checks, stale evidence or another
    contractor's task.
  judging_criteria: T, D
  demo: D08 companion
- id: FR-38
  priority: Could
  acceptance_criteria: Given two retained deliveries for the same task, when comparison is opened, then
    show clearly labeled artifacts/run times and corresponding results without merging references or changing
    current release eligibility.
  judging_criteria: D, P
  demo: D06–D08 optional
- id: FR-10
  priority: Must
  acceptance_criteria: Given current passing evidence or permitted grounded resolution and valid authority,
    when the decision request is dispatched, then the executor binds receiver/USD amount from the frozen
    snapshot, calls only the sandbox payout endpoint and persists provider references.
  judging_criteria: T
  demo: D08–D09
- id: FR-11
  priority: Must
  acceptance_criteria: Given creation, verified webhook or polling, when status is reconciled, then match
    batch/item/sender identity, receiver binding and amount, retain raw status, and mark paid only on
    matched item `SUCCESS`; batch success or a mismatch cannot mark paid.
  judging_criteria: T, P
  demo: D09–D10
- id: FR-12
  priority: Must
  acceptance_criteria: Given a confirmed `UNCLAIMED` item, when the owner or configured recovery policy
    requests cancellation, then refresh eligibility, call cancel through the executor, and retain reservation
    until item reconciliation proves return.
  judging_criteria: T
  demo: D10 companion
- id: FR-14
  priority: Must
  acceptance_criteria: Given the same delivery/decision/event or lost creation response, when processed
    again, then resolve the existing obligation/attempt, reuse its persisted sender IDs for permitted
    retransmission, and create no second financial initiation.
  judging_criteria: T, P
  demo: D11
- id: FR-26
  priority: Must
  acceptance_criteria: Given any payout recommendation, when evaluated, then record each guard's pass/fail
    and a user-facing reason; a failed guard exposes a permitted next action while blocking dispatch.
  judging_criteria: T, D
  demo: D08
- id: FR-27
  priority: Must
  acceptance_criteria: Given eligible release, when accepted by the backend, then commit reservation,
    attempt identity, sender IDs and outbox work together before external dispatch; a crash/retry recovers
    that same attempt rather than minting another.
  judging_criteria: T
  demo: D09, D11 companion
- id: FR-28
  priority: Must
  acceptance_criteria: Given a PayPal event, when ingested, then verify genuine signature/context through
    the executor before financial mutation, store event ID/hash, and enqueue matched item reconciliation
    once; unverifiable/mismatched events change no payment state and cannot poison dedup for a later genuine
    event.
  judging_criteria: T
  demo: D09–D10 companion
- id: FR-29
  priority: Must
  acceptance_criteria: Given provider-confirmed nonpayment, when retry is requested, then require a retryable
    reason, still-valid evidence/authority, remaining cap and fewer than approved attempts; create a new
    numbered attempt and sender IDs while retaining old item history.
  judging_criteria: T
  demo: D08–D10 companion
- id: FR-30
  priority: Must
  acceptance_criteria: Given an existing initiated/unknown/unclaimed attempt, when its mandate expires
    or is superseded, then stop new initiation under that version and continue status/recovery handling
    without deleting the attempt or releasing reserve speculatively.
  judging_criteria: T
  demo: D09–D10 companion
- id: FR-31
  priority: Must
  acceptance_criteria: Given cancellation races with a claim or returns an ambiguous acknowledgement,
    when refreshed, then show the actual matched success/return/pending state, post budget changes once,
    and never label cancelled or release principal solely from HTTP acceptance.
  judging_criteria: T
  demo: D10 companion
- id: FR-32
  priority: Must
  acceptance_criteria: Given mandate/attempt status, when payment detail is viewed, then display cap,
    reserved/consumed/released principal, remaining business attempts, observed fees and reconciliation
    time; configured allowance is not presented as a PayPal balance or escrow.
  judging_criteria: T, D
  demo: D08–D10
- id: FR-13
  priority: Must
  acceptance_criteria: Given a reconciled item, when an authorized owner/contractor opens its record,
    then link brief, approved version, artifact, evidence, AI/human decision, executor guards, principal,
    observed fees and provider IDs; only matched success is labeled paid.
  judging_criteria: T, D, P
  demo: D10, D12
- id: FR-33
  priority: Must
  acceptance_criteria: Given missing fee information, pending status or a newer observation, when the
    receipt is viewed, then show unknown/not-yet-reported values explicitly, retain event timestamps and
    source references, and never replace missing data with invented zero fees or success.
  judging_criteria: T, D, P
  demo: D10
- id: FR-15
  priority: Must
  acceptance_criteria: Given the active role and task, when navigating, then expose an AG Grid owner queue
    with sorting/status filtering and task detail, Brief Composer, Mandate Approval, Evidence Review,
    payment record/receipt, and permitted contractor submit/correction/status views; state and next action
    agree across surfaces.
  judging_criteria: D, P
  demo: D01, D04, D06, D12
- id: FR-34
  priority: Must
  acceptance_criteria: Given an assigned contractor, when they view or submit a task, then show only their
    checks, delivery/correction and payment records; deny another recipient's data, approval, financial
    overrides, cancellation and reset even through direct API calls.
  judging_criteria: T, D
  demo: D05, D07, D12
- id: FR-16
  priority: Must
  acceptance_criteria: Given a reset request, when unresolved initiated/unknown/unclaimed movement exists
    in the demo workspace, then defer with its reference; when safe, create a fresh demo namespace while
    retaining financial, dedup and audit history.
  judging_criteria: T, D, P
  demo: D01, D11 companion
- id: FR-35
  priority: Must
  acceptance_criteria: Given configured sandbox/model access and an actual completed execution bundle,
    when seeding, then create the approved mid-flow case and expose the real completed evidence/transaction
    chain; if no real completed bundle exists, report it missing and keep that case pending.
  judging_criteria: T, D, P
  demo: D01, D10 companion
- id: FR-36
  priority: Must
  acceptance_criteria: Given a judge visit, when readiness is checked, then show current application/database/worker/fixture
    dependencies and whether the actual completed seed exists; unavailable model/provider work stays failed/pending
    with instructions and cannot be shown as success.
  judging_criteria: D, P
  demo: D01 companion
- id: FR-37
  priority: Must
  acceptance_criteria: Given a safe reset, when committed, then assign fresh task/mandate/run identifiers
    and append a reset event, retain prior attempts/evidence/webhook dedup, and leave wallet funding and
    durable workspace allowance unchanged.
  judging_criteria: T, D, P
  demo: D01, D11 companion
- id: NFR-01
  priority: Must
  acceptance_criteria: Given browser/model/runner/fixture configuration or a live-mode request, when inspected,
    then those components contain no PayPal secrets and live base URLs are rejected; only the backend
    executor can perform the six PayPal operations.
  judging_criteria: T
  demo: D08–D10 companion
- id: NFR-02
  priority: Must
  acceptance_criteria: Given concurrent workers, restart, transport uncertainty or replay after reset,
    when processed, then one obligation has at most one unresolved attempt and one successful payment;
    database uniqueness and locked transitions preserve this across mandate versions.
  judging_criteria: T
  demo: D09, D11 companion
- id: NFR-03
  priority: Must
  acceptance_criteria: Given dispatch/status/cancellation transitions, when posted, then reserve/consume/release
    principal once under both mandate cap and durable workspace allowance; pending/unclaimed/unknown funds
    remain reserved, fees separate, and totals never become negative.
  judging_criteria: T
  demo: D08–D10 companion
- id: NFR-04
  priority: Must
  acceptance_criteria: Given unapproved code/artifact/template/URL or a credential request, when a runner
    job is validated, then reject it; allowed runs use trusted fixture templates in a separate container
    without PayPal/model keys or financial write access.
  judging_criteria: T
  demo: D05–D08 companion
- id: NFR-05
  priority: Must
  acceptance_criteria: Given approval, submission, review, supersession, payout, reconciliation or reset,
    when recorded, then append actor/service identity, timestamp, correlation ID, relevant digests and
    source references without rewriting prior approval/evidence/attempt records.
  judging_criteria: T, D
  demo: D04, D06, D10–D11
- id: NFR-06
  priority: Must
  acceptance_criteria: Given another contractor's identifier or owner-only operation, when any API/evidence
    endpoint is called, then deny unauthorized access independent of UI role selection; responses disclose
    no protected cross-role evidence/financial bindings.
  judging_criteria: T, D
  demo: D04, D12 companion
- id: NFR-07
  priority: Should
  acceptance_criteria: Given 30 measured warm local runs, when benchmarked, then target p95 accepted-command
    acknowledgement <=1s and runner execution <=30s; report queue, model and provider waiting separately
    with hardware/environment and actual results.
  judging_criteria: D, P
  demo: D03, D05–D10
- id: NFR-08
  priority: Must
  acceptance_criteria: Given supplied access instructions before 15 December 2026, 16:00 UTC, when followed,
    then the working workspace, role access, fixtures, evidence and genuine provider records remain available;
    operational coverage targets 16 December, 00:00 UTC.
  judging_criteria: D, P
  demo: D01–D12
- id: NFR-09
  priority: Must
  acceptance_criteria: Given three agency-owner interviews and at least one paired manual/assisted review
    observation per owner, when findings are reported, then include actual timings, task/order/sample
    limitations and negative results; no invented time-saving or customer claim appears.
  judging_criteria: I
  demo: D01
- id: NFR-10
  priority: Must
  acceptance_criteria: Given a crash before/after job claim, state commit or provider dispatch, when workers
    recover, then durable work resumes or remains visibly held, no accepted job vanishes, and redelivery
    preserves the same attempt and audit correlation.
  judging_criteria: T
  demo: D05, D09, D11 companion
- id: NFR-11
  priority: Must
  acceptance_criteria: Given token expiry, transient failure, lost response or delayed recovery, when
    handled, then use bounded backoff and the original attempt identity, retain unknown reservations,
    and prohibit unsafe late retransmission outside duplicate protection; secrets remain redacted.
  judging_criteria: T
  demo: D09–D10 companion
- id: NFR-12
  priority: Must
  acceptance_criteria: Given amounts, fees, expiry or timestamps, when validated/stored/compared, then
    use integer cents or exact decimals with two-place USD validation and UTC instants; invalid precision/currency
    and ambiguous expiry input are rejected rather than rounded silently.
  judging_criteria: T
  demo: D04, D08–D10 companion
- id: NFR-13
  priority: Must
  acceptance_criteria: Given runner PNG/JSON artifacts, when ingested or fetched, then verify digest/task/run/mandate
    binding, enforce allowed media and size limits, and persist bytes durably; tampered or mismatched
    data cannot authorize release.
  judging_criteria: T
  demo: D05–D08 companion
- id: NFR-14
  priority: Must
  acceptance_criteria: Given owner/contractor/judge navigation, when performed by keyboard, then controls
    and dialogs have names, focus behavior and visible state; failures/status are announced and never
    depend on color alone.
  judging_criteria: D, P
  demo: D01–D12 companion
- id: NFR-15
  priority: Must
  acceptance_criteria: Given application/job/payment failure, when observed, then structured logs and
    health/readiness expose stage, request/job/attempt correlation and actionable error without tokens,
    credentials or full receiver addresses.
  judging_criteria: T, P
  demo: D05–D10 companion
- id: NFR-16
  priority: Must
  acceptance_criteria: Given a clean checkout and documented environment inputs, when the final <=3 setup
    commands are followed, then Compose starts the required services and seeds truthful cases; hosted
    judges do not supply personal API keys.
  judging_criteria: T, D, P
  demo: D01 companion
- id: NFR-17
  priority: Must
  acceptance_criteria: Given a compiler/reviewer call or canonical evaluation, when executed, then record
    model/prompt/schema versions, input/evidence hashes, valid output/error and call usage where reported;
    apply finite timeout/repair limits and all three family cases.
  judging_criteria: T, N, P
  demo: D03, D06 companion
- id: NFR-18
  priority: Must
  acceptance_criteria: Given reset, restart or cleanup during judging, when performed, then preserve approved
    snapshots, actual evidence/decisions, attempts/provider references, webhook dedup and budget history
