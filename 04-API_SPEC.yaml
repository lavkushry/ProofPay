openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: ProofPay Application API
  version: 0.1.0
  description: 'ProofPay compiles the review queue between ''work submitted'' and ''payment released''
    into executable acceptance checks — and pays only when evidence passes.


    Phase 2 contract, not an implemented server. Read docs/00-PROJECT_CONTEXT.md and docs/02-PRD.md. One
    agency, one fixture, two sandbox recipients, USD, exactly three approved checks and three families.
    Examples/identifiers are illustrative unless execution evidence says otherwise. Cookie domain mutations
    require CSRF and Idempotency-Key; internal tool/runner credentials never enter model context. Paid
    requires a matched actual PayPal item SUCCESS.'
  license:
    name: MIT
    identifier: MIT
servers:
- url: http://localhost:8000
  description: Local Compose API; production cookies require HTTPS.
tags:
- name: Health
- name: Sessions
- name: Catalog
- name: Briefs
- name: Mandates
- name: Tasks
- name: Deliveries
- name: Evidence
- name: Corrections
- name: Payments
- name: Receipts
- name: Jobs
- name: Contractor
- name: Judge
- name: Webhooks
- name: Internal AI
- name: Internal Runner
security:
- SessionCookie: []
paths:
  /livez:
    get:
      operationId: get_liveness
      summary: get liveness
      description: Process responsiveness only. No provider/model transaction or secrets.
      tags:
      - Health
      x-roles: []
      x-requirement-ids:
      - NFR-15
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              schema: &id001
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        default:
          $ref: '#/components/responses/Unexpected'
      security: []
  /readyz:
    get:
      operationId: get_readiness
      summary: get readiness
      description: Database/configuration readiness and worker/runner freshness. No payout created by
        health probes.
      tags:
      - Health
      x-roles: []
      x-requirement-ids:
      - FR-36
      - NFR-15
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Required service not ready.
          headers:
            X-Request-ID:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        default:
          $ref: '#/components/responses/Unexpected'
      security: []
  /api/session:
    post:
      operationId: create_demo_session
      summary: create demo session
      description: Validate configured demo access code; assign one of three existing personas. Creates
        original judge principal and scoped effective user; grants no provider access.
      tags:
      - Sessions
      x-roles: []
      x-requirement-ids:
      - NFR-06
      - NFR-19
      responses:
        '201':
          description: Success
          headers:
            X-Request-ID:
              schema: *id001
            Set-Cookie:
              schema:
                type: string
                maxLength: 1024
              description: Opaque proofpay_session; HttpOnly; Secure; SameSite=Lax; Path=/.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreate'
    get:
      operationId: get_session
      summary: get session
      description: ''
      tags:
