          minItems: 0
          maxItems: 30
        retryable:
          type: boolean
      required:
      - code
      - message
      - request_id
      - details
      - retryable
      description: Codes include INVALID_REQUEST, UNSUPPORTED_SCOPE, UNAUTHORIZED, FORBIDDEN, NOT_FOUND,
