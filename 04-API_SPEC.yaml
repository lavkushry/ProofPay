        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
      - RunnerServiceToken: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerHeartbeat'
  /internal/runner/jobs/{job_id}/complete:
    post:
      operationId: complete_runner_job
      summary: complete runner job
      description: Validate lease/digests/results/media before immutable bundle commit. Same job and same
        completion digest replays bundle; conflicting completion rejected.
      tags:
      - Internal Runner
      x-roles:
      - runner_service
      x-requirement-ids:
      - FR-06
      - FR-22
      - NFR-13
      responses:
        '200':
          description: Success
          headers:
            X-Request-ID:
              schema: *id001
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerCompletionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Invalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Unexpected'
      security:
      - RunnerServiceToken: []
      parameters:
      - name: job_id
        in: path
        required: true
        schema: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerCompletion'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: proofpay_session
      description: Opaque session; role/agency resolved server-side.
    WorkerServiceToken:
      type: http
      scheme: bearer
      description: Application worker audience; job/stage/lease context checked. Never a PayPal token.
    RunnerServiceToken:
      type: http
      scheme: bearer
      description: Distinct runner audience; no app financial or AI access.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id001
      description: 'Required for domain mutations. Scope: agency, original principal, effective persona,
        canonical command family and key. Contractor delivery aliases share submit_delivery. Recheck authorization
        before replaying original result; changed digest gives 409. Retained across reset.'
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Session-bound token; required with cookie authentication on mutation.
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    WorkflowJob:
      name: X-Workflow-Job-ID
      in: header
      required: true
      schema: *id001
    WorkflowLease:
      name: X-Workflow-Lease-Token
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
      description: Backend context only; never supplied to the LLM. Must match active job lease and permitted
        stage.
  responses:
    BadRequest:
      description: Malformed JSON/header or duplicate keys.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing/expired session or service credential.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Role, CSRF, service audience or stage denied.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource absent or inaccessible in agency/contractor scope.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Stale digest/version, idempotency conflict or workspace busy.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalid:
      description: Schema, scope, parameter, money or authority input invalid.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Request limit reached; retry after the supplied delay.
      headers:
        X-Request-ID:
          schema: *id001
        Retry-After:
          schema:
            type: string
            maxLength: 80
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Durable storage or required service unavailable.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unexpected:
      description: Unexpected error; use request_id without exposed secrets.
      headers:
        X-Request-ID:
          schema: *id001
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Money:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          enum:
          - USD
        value:
          type: string
          maxLength: 16
          pattern: ^(0|[1-9][0-9]{0,8})\.[0-9]{2}$
      required:
      - currency
      - value
    PositiveMoney:
      type: object
      additionalProperties: false
      properties:
        currency:
          type: string
          enum:
          - USD
        value:
          type: string
          maxLength: 16
          pattern: ^(?!0\.00$)(0|[1-9][0-9]{0,8})\.[0-9]{2}$
      required:
      - currency
      - value
    PaymentTerms:
      type: object
      additionalProperties: false
      properties:
        recipient_ref:
          type: string
          enum:
          - contractor_maya
          - contractor_leo
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        principal_cap:
          $ref: '#/components/schemas/PositiveMoney'
        max_attempts:
          type: integer
          minimum: 1
          maximum: 3
        expires_at: &id002
          type: string
          format: date-time
          pattern: .*(Z|[+-][0-9]{2}:[0-9]{2})$
      required:
      - recipient_ref
      - amount
      - principal_cap
      - max_attempts
      - expires_at
      description: Cap must cover amount; expiry must be future at approval. Workspace allowance remains
        an independent durable control.
