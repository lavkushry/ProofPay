    AcceptanceCheck:
      oneOf:
      - $ref: '#/components/schemas/Check_viewport_no_horizontal_overflow'
      - $ref: '#/components/schemas/Check_cart_total_unchanged'
      - $ref: '#/components/schemas/Check_keyboard_checkout_reachable'
      - $ref: '#/components/schemas/Check_api_status'
      - $ref: '#/components/schemas/Check_api_schema'
      - $ref: '#/components/schemas/Check_api_total_matches_fixture'
      - $ref: '#/components/schemas/Check_keyboard_activation'
      - $ref: '#/components/schemas/Check_accessible_control_name'
    CheckProposal:
      type: object
      additionalProperties: false
      properties:
        checks:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/AcceptanceCheck'
            minItems: 3
            maxItems: 3
          - type: array
            items:
              $ref: '#/components/schemas/AcceptanceCheck'
            minItems: 0
            maxItems: 0
        ambiguities:
          type: array
          items:
            type: string
            maxLength: 600
          minItems: 0
          maxItems: 5
        clarifying_questions:
          type: array
          items:
            type: string
            maxLength: 600
          minItems: 0
          maxItems: 5
      required:
      - checks
      - ambiguities
      - clarifying_questions
      description: Approval requires exactly three distinct checks with approved=false in proposal and
        true in frozen approval. Unresolved ambiguity returns zero checks; family semantics and manifest
        bindings are checked server-side.
    SessionCreate:
      type: object
      additionalProperties: false
      properties:
        access_code:
          type: string
          maxLength: 256
          minLength: 1
        persona:
          type: string
          enum:
