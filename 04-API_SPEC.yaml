  assumption: Configured application demo access grants only the three preassigned personas.
  validation: Direct role/resource denial cases.
- id: A-A02
  assumption: Principal-only budget and at most three business attempts.
  validation: Ledger and authority guards.
- id: A-A03
  assumption: Actual completed archive exists before judge-ready seed.
  validation: Missing archive remains pending.
- id: A-A04
